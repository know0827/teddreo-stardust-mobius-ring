          <label class="efp-label">電話 <span style="color:var(--danger);">*</span></label>
          <input type="tel" class="text-input" id="customerPhoneInput" placeholder="請輸入電話(需與訂單收件人相符)"
                 value="${state.customerPhone.replace(/"/g,'&quot;')}" oninput="setCustomerPhone(this.value)">
        </div>
      </div>
      <div class="card" id="reportOrderPlaceholder" style="${(state.customerName.trim() && state.customerPhone.trim()) ? 'display:none;' : ''}">
        <h3>回報訂單</h3>
        <p class="notice" style="margin:0;">請先在上方填寫姓名與電話,填寫完成後即會顯示「送出設計圖」等回報方式。</p>
      </div>
      <div class="card" id="reportOrderCard" style="${(state.customerName.trim() && state.customerPhone.trim()) ? '' : 'display:none;'}">
        <h3>回報訂單</h3>
        <p class="notice">💡 小提醒：建議使用 LINE 帳號註冊登入！確認訂單後，系統會自動將您的客製化設計圖與訂單資訊同步發送至官方 LINE；隨時掌握製作進度，後續有任何設計細節想溝通也更方便快速喔！</p>
        <div class="action-row">
          <button class="act" onclick="downloadDesignPhoto()">下載我的設計圖</button>
        </div>
        <div class="action-row">
          <button class="act primary" id="submitDesignBtn" onclick="submitOrLoginThenSend()">登入 LINE 並送出設計圖</button>
        </div>
        <p class="notice" id="submitStatusMsg" style="display:none;"></p>
      </div>
      <div class="restart"><button onclick="restartAll()">重新開始設計</button></div>
    `;
  }
  return '';
}

function chevronSVG(){
  return `<svg class="section-chevron" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function renderAccordion(){
  const visible = SECTIONS.slice(0, state.revealedStep+1);
  const html = visible.map(sec=>{
    const open = state.openSection===sec.id;
    return `
    <div class="section ${open?'open':''}" id="sec-${sec.id}">
      <div class="section-head" onclick="toggleSection('${sec.id}')">
        <span class="section-num">${sec.num}</span>
        <span class="section-title serif">${sec.title}</span>
        <span class="section-summary">${sec.summary()}</span>
        ${chevronSVG()}
      </div>
      <div class="section-body">${open ? sectionBody(sec.id) : ''}</div>
    </div>`;
  }).join('');
  document.getElementById('accordion').innerHTML = html;
}

function toggleSection(id){
  state.openSection = (state.openSection===id) ? null : id;
  renderAccordion();
}

/* 解鎖並開啟下一個步驟(若尚未解鎖過) */
function advanceStep(fromId){
  const idx = SECTIONS.findIndex(s=>s.id===fromId);
  if(idx<0) return;
  const nextIdx = idx+1;
  if(nextIdx < SECTIONS.length){
    state.revealedStep = Math.max(state.revealedStep, nextIdx);
    state.openSection = SECTIONS[nextIdx].id;
  }
}
function goNext(fromId){ advanceStep(fromId); refreshAll(); }

/* ---------- 事件處理 ---------- */
function refreshAll(){ rebuildRing(); renderAccordion(); }

function setShape(key){
  const s = SHAPES.find(x=>x.key===key);
  if(s && s.disabled) return;
  state.shape = key; state.previewShape = null;
  const allowed = SHAPE_ALLOWED_WIDTHS[key] || WIDTHS;
  if(!allowed.includes(state.width)) state.width = allowed[0]; /* 目前寬度在新形狀不可施作時,自動改選該形狀第一個可用寬度 */
  advanceStep('shape'); refreshAll();
}
function previewShape(key){
  /* 暫停供應的形狀:只更新 3D 預覽畫面讓消費者參考樣式,不會變更實際選取的戒指形狀 */
  state.previewShape = key;
  rebuildRing();
}
function setWidth(mm){
  const allowed = SHAPE_ALLOWED_WIDTHS[state.shape] || WIDTHS;
  if(!allowed.includes(mm)) return;
  state.width = mm; advanceStep('width'); refreshAll();
}
function setGemColor(key){ state.gemColor = key; state.gemChosen = true; advanceStep('gem'); refreshAll(); }
function setFinish(key){
  state.finish = key; advanceStep('finish'); refreshAll();
}
function setRingSize(val){
  /* 限制在 2-27 號範圍內,避免輸入超出實際可製作的尺寸區間 */
  if(val !== ''){
    let n = parseInt(val, 10);
    if(!Number.isNaN(n)){
      n = Math.max(2, Math.min(31, n));
      val = String(n);
    }
  }
  state.ringSize = val;
  refreshAll();
}
function setEngraveColor(pos, c){
  if(pos==='inner') state.engraveInnerColor = c;
  else if(pos==='outer') state.engraveOuterColor = c;
  else state.engraveSideColor = c;
  refreshAll();
}
function setEngraveFont(pos, key){
  if(pos==='inner') state.engraveInnerFont = key;
  else if(pos==='outer') state.engraveOuterFont = key;
  else state.engraveSideFont = key;
  refreshAll();
}
function toggleEngravePos(pos){
  if(pos==='inner') state.engraveInnerOn = !state.engraveInnerOn;
  else if(pos==='outer') state.engraveOuterOn = !state.engraveOuterOn;
  else state.engraveSideOn = !state.engraveSideOn;
  refreshAll();
}
function changeCount(key, delta){ state[key] = Math.max(0, Math.min(10, state[key]+delta)); refreshAll(); }

function setEngraveText(pos, val){
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  state[`engrave${cap(pos)}Text`] = val;
  rebuildRing();
  const cc = document.querySelector(`#engrave${cap(pos)}Input + .efp-charcount`);
  if(cc){ const n=Array.from(val).length; cc.textContent = `${n} / ${ENGRAVE_MAX_CHARS}`; cc.className = 'efp-charcount' + (n>ENGRAVE_MAX_CHARS?' over':''); }
  const ep = document.getElementById('engravePreview');
  if(ep) ep.innerHTML = engravePreviewSVG();
}

function buildOrderText(){
  const shapeInfo = SHAPES.find(s=>s.key===state.shape);
  const finishInfo = FINISHES.find(f=>f.key===state.finish);
  return [
    `【${BRAND_NAME} 訂購資訊】`,
    `戒指形狀:${shapeInfo.name}`,
    `戒指寬度:${state.width}mm`,
    `表面工藝:${finishInfo.name}`,
    `刻字內容:${engraveSummaryText()}`,
    `戒指尺寸:${state.ringSize ? state.ringSize+' 號' : '(尚未填寫)'}`,
    `以上是我設計的戒指內容,麻煩幫我報價,謝謝。`
  ].join('\n');
}

function copyOrder(){
  const text = buildOrderText();
  const btn = event.target;
  const done = ()=>{ const o=btn.textContent; btn.textContent='已複製!'; setTimeout(()=>{btn.textContent=o;},1800); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ alert('複製失敗,請手動選取文字複製'); }
  document.body.removeChild(ta);
}

/* 複製訂單文字到剪貼簿,同時開啟 LINE 並帶入預先填好的訊息內容,方便一鍵傳送給官方帳號 */
/* 產生訂單彙整圖片(canvas),供分享/顯示使用 */
function buildOrderCanvas(){
  const shapeInfo = SHAPES.find(s=>s.key===state.shape);
  const finishInfo = FINISHES.find(f=>f.key===state.finish);

  const W=900, H=1020;
  const canvas = document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#f6f4ef'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = '#e2ddcf'; ctx.lineWidth=2; ctx.strokeRect(24,24,W-48,H-48);

  ctx.textAlign='center';
  ctx.fillStyle = '#9c7f4f';
  ctx.font = '600 22px Georgia, serif';
  ctx.fillText('C U S T O M   R I N G   O R D E R', W/2, 96);
  ctx.fillStyle = '#26241f';
  ctx.font = '600 52px Georgia, serif';
  ctx.fillText('teddreo', W/2, 156);

  ctx.strokeStyle = '#e2ddcf'; ctx.beginPath(); ctx.moveTo(80,196); ctx.lineTo(W-80,196); ctx.stroke();

  ctx.fillStyle = '#7c7669';
  ctx.font = '13px sans-serif';
  ctx.textAlign='left';
  ctx.fillText('建立時間', 80, 236);
  ctx.textAlign='right';
  ctx.fillStyle = '#26241f';
  ctx.font = '13px sans-serif';
  ctx.fillText(new Date().toLocaleString('zh-TW'), W-80, 236);

  const rows = [
    ['戒指形狀', shapeInfo.name],
    ['戒指寬度', state.width+'mm'],
    ['表面工藝', finishInfo.name],
    ['刻字內容', engraveSummaryText()],
    ['戒指尺寸', state.ringSize ? state.ringSize+' 號' : '(尚未填寫)'],
  ];

  let y = 460;
  ctx.textAlign='left';
  rows.forEach(([l,v])=>{
    ctx.fillStyle = '#7c7669'; ctx.font='14px sans-serif';
    ctx.fillText(l, 80, y);
    ctx.fillStyle = '#26241f'; ctx.font='600 14px sans-serif'; ctx.textAlign='right';
    const vText = String(v).length>28 ? String(v).slice(0,28)+'…' : String(v);
    ctx.fillText(vText, W-80, y);
    ctx.textAlign='left';
    ctx.strokeStyle='#e2ddcf'; ctx.beginPath(); ctx.moveTo(80,y+16); ctx.lineTo(W-80,y+16); ctx.stroke();
    y += 48;
  });

  ctx.textAlign='center';
  ctx.fillStyle = '#a8a196'; ctx.font='12px sans-serif';
  ctx.fillText('此為設計選項彙整表單,回報至官方 LINE 後我們將提供報價', W/2, H-56);

  return canvas;
}

/* 開新分頁顯示圖片,供無法使用分享功能的裝置(如桌機瀏覽器)長按/右鍵另存 */
function openImageInNewTab(dataUrl, filename){
  /* 先前用 window.open('','_blank') + document.write() 的做法,在部分手機瀏覽器(尤其 iOS 內建瀏覽器/
     App 內的網頁檢視器)並不可靠,document.write() 對一個以空白網址開啟的視窗常常無法正確生效,
     導致實際看到的還是瀏覽器原生的圖片檢視畫面,完全沒有套用到我們自訂的版面。
     改用 Blob 產生一個真正獨立的 HTML 文件網址,再用這個網址開啟分頁,才能確保穩定顯示自訂版面 */
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${filename}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;background:#1c1b18;}
    .wrap{width:100%;padding:14px;}
    img{display:block;width:100%;height:auto;border-radius:4px;}
    .hint{text-align:center;color:#a8a196;font-family:sans-serif;font-size:12.5px;line-height:1.8;padding:14px 16px 26px;}
    </style>
    </head><body>
    <div class="wrap">
      <img src="${dataUrl}" alt="${filename}">
      <p class="hint">長按圖片即可儲存至相簿,或於電腦上按右鍵另存圖片</p>
    </div>
    </body></html>`;
  const htmlBlob = new Blob([html], {type:'text/html;charset=utf-8'});
  const htmlUrl = URL.createObjectURL(htmlBlob);
  const win = window.open(htmlUrl, '_blank');
  if(win){
    setTimeout(()=>URL.revokeObjectURL(htmlUrl), 60000);
  } else {
    /* 彈出視窗被瀏覽器阻擋時 window.open 會靜默回傳 null,先前完全沒有處理這種情況,
       導致按了按鈕卻「沒動靜」。這裡加上備援:改用直接下載連結,並提示使用者原因 */
    try{
      const link = document.createElement('a');
      link.download = filename;
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }catch(e){}
    alert('瀏覽器阻擋了彈出視窗,已改用直接下載;若還是沒有反應,請到瀏覽器設定裡允許本網站的「彈出式視窗」後再試一次。');
  }
}

/* 下載最終成品的3D設計圖:直接擷取目前戒指預覽畫布的當下畫面,做成一張照片供消費者儲存留念 */
/* 圓角矩形輔助函式 */
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* 「下載我的設計圖」用的組合式畫布:把 3D 戒指預覽畫面、刻字字體預覽、訂單資訊整合成一張圖 */
function buildDesignPhotoCanvas(){
  /* 先把 3D 渲染器暫時放大到高解析度拍照,避免直接擷取畫面上很小的即時預覽畫布,
     導致放大到設計圖裡時變得模糊;拍完後再把渲染器還原回原本畫面上顯示的大小 */
  const stage = document.getElementById('viewerStage');
  const liveSize = stage.clientWidth;
  const captureSize = 1400;
  renderer.setSize(captureSize, captureSize, false);
  camera.aspect = 1;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  const ringImg = renderer.domElement;

  const shapeInfo = SHAPES.find(s=>s.key===state.shape);
  const finishInfo = FINISHES.find(f=>f.key===state.finish);

  const W = 900;
  const imgSize = 700;
  const topPad = 46;
  const titleBlockH = 46;
  const orderRows = [
    ['戒指形狀', shapeInfo.name],
    ['戒指寬度', state.width+'mm'],
    ['表面工藝', finishInfo.name],
    ['戒指尺寸', state.ringSize ? state.ringSize+' 號' : '(尚未填寫)'],
  ];
  const rowH = 50;
  const orderColH = orderRows.length*rowH;
  const engraveH = 210;
  const colBlockH = Math.max(orderColH, engraveH);
  const footerH = 20;
  const H = topPad + titleBlockH + imgSize + 36 + colBlockH + 36 + footerH + 12;

  const canvas = document.createElement('canvas');
  const OUT_SCALE = 2; /* 輸出解析度加倍,讓存下來的設計圖在手機上放大看也清晰 */
  canvas.width = W*OUT_SCALE; canvas.height = H*OUT_SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(OUT_SCALE, OUT_SCALE);

  ctx.fillStyle = '#f6f4ef'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = '#e2ddcf'; ctx.lineWidth=2; ctx.strokeRect(24,24,W-48,H-48);

  let y = topPad;

  /* 小尺寸文字標題 */
  ctx.textAlign='center';
  ctx.fillStyle = '#26241f';
  ctx.font = '600 22px Georgia, serif';
  ctx.fillText(BRAND_NAME, W/2, y+22);
  y += titleBlockH;

  /* 3D 戒指預覽畫面 */
  const imgX = (W-imgSize)/2;
  ctx.fillStyle = '#f0ece3'; ctx.fillRect(imgX, y, imgSize, imgSize);
  ctx.drawImage(ringImg, imgX, y, imgSize, imgSize);
  ctx.strokeStyle = '#e2ddcf'; ctx.lineWidth=1; ctx.strokeRect(imgX, y, imgSize, imgSize);

  /* 擷取完成,把渲染器還原回畫面上原本顯示的大小,避免留在高解析度狀態影響即時預覽的效能 */
  renderer.setSize(liveSize, liveSize, false);
  camera.aspect = 1;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);

  /* 浮水印:置中疊在 3D 預覽圖上,單行呈現,顏色淺淡不搶眼 */
  ctx.save();
  ctx.textAlign='center';
  ctx.fillStyle = 'rgba(38,36,31,0.22)';
  ctx.font = '16px "Noto Sans TC", sans-serif';
  ctx.fillText('以上設計圖僅提供品牌 teddreo 使用,未經許可禁止其他商業用途。', W/2, y+imgSize/2);
  ctx.restore();

  y += imgSize + 36;

  /* 左右並排:訂單資訊與刻字字體預覽寬度一致 */
  const margin = 60, gapCols = 24;
  const orderColW = (W - margin*2 - gapCols)/2;
  const engraveColW = orderColW;
  const leftX = margin;
  const rightX = margin + orderColW + gapCols;

  /* 左欄:訂單資訊 */
  ctx.textAlign='left';
  let ly = y + 20;
  orderRows.forEach(([l,v])=>{
    ctx.fillStyle = '#7c7669'; ctx.font='18px "Noto Sans TC", sans-serif';
    ctx.fillText(l, leftX, ly);
    ctx.fillStyle = '#26241f'; ctx.font='600 18px "Noto Sans TC", sans-serif'; ctx.textAlign='right';
    const vText = String(v).length>20 ? String(v).slice(0,20)+'…' : String(v);
    ctx.fillText(vText, leftX+orderColW, ly);
    ctx.textAlign='left';
    ctx.strokeStyle='#e2ddcf'; ctx.beginPath(); ctx.moveTo(leftX,ly+11); ctx.lineTo(leftX+orderColW,ly+11); ctx.stroke();
    ly += rowH;
  });

  /* 右欄:刻字字體預覽框 */
  ctx.fillStyle = '#ffffff';
  roundRectPath(ctx, rightX, y, engraveColW, engraveH, 14);
  ctx.fill();
  ctx.strokeStyle = '#d3ccb9'; ctx.lineWidth=1.5;
  roundRectPath(ctx, rightX, y, engraveColW, engraveH, 14);
  ctx.stroke();

  const engraveRows = [];
  if(state.engraveInnerOn) engraveRows.push({
    label:'內側刻字', text: state.engraveInnerText || '(尚未填寫)',
    color: state.engraveInnerColor==='black' ? '#2a251f' : '#9c9690',
    fam: (ENGRAVE_FONTS.find(fo=>fo.key===state.engraveInnerFont)||ENGRAVE_FONTS[0]).family
  });
  if(state.engraveOuterOn) engraveRows.push({
    label:'外側刻字', text: state.engraveOuterText || '(尚未填寫)',
    color: state.engraveOuterColor==='black' ? '#2a251f' : '#9c9690',
    fam: (ENGRAVE_FONTS.find(fo=>fo.key===state.engraveOuterFont)||ENGRAVE_FONTS[0]).family
  });
  if(state.engraveSideOn) engraveRows.push({
    label:'厚度側邊刻字', text: state.engraveSideText || '(尚未填寫)',
    color: state.engraveSideColor==='black' ? '#2a251f' : '#9c9690',
    fam: (ENGRAVE_FONTS.find(fo=>fo.key===state.engraveSideFont)||ENGRAVE_FONTS[0]).family
  });
  const centerX = rightX + engraveColW/2;
  ctx.textAlign='center';
  if(!engraveRows.length){
    ctx.fillStyle = '#a8a196'; ctx.font = '13px "Noto Sans TC", sans-serif';
    ctx.fillText('尚未選擇刻字位置', centerX, y+engraveH/2+5);
  } else {
    /* 用固定行距置中排列,不隨外框高度而拉開,避免內容上下留白過多 */
    const rowSpacing = 100;
    const contentH = (engraveRows.length-1) * rowSpacing;
    const startY = y + engraveH/2 - contentH/2;
    engraveRows.forEach((r,i)=>{
      const ry = startY + i*rowSpacing;
      ctx.fillStyle = r.color;
      /* 與3D戒指刻字一致:粗體700、字距依字體規格,逐字繪製置中 */
      {
        const fs0 = 27, gap0 = fs0*engraveGapEm(r.fam);
        const chs = Array.from(r.text);
        const ws = chs.map(c=>{ ctx.font = engraveFontOf(fs0, c, r.fam); return ctx.measureText(c).width; });
        let tw = ws.reduce((a,b)=>a+b,0) + gap0*Math.max(0,chs.length-1);
        const maxW = engraveColW - 40;
        let fs = fs0, gap = gap0;
        if(tw > maxW){
          const k = maxW/tw; fs = fs0*k; gap = gap0*k;
          chs.forEach((c,j)=>{ ctx.font = engraveFontOf(fs, c, r.fam); ws[j] = ctx.measureText(c).width; });
          tw = ws.reduce((a,b)=>a+b,0) + gap*Math.max(0,chs.length-1);
        }
        const prevAlign = ctx.textAlign; ctx.textAlign = 'left';
        let px = centerX - tw/2;
        chs.forEach((c,j)=>{ ctx.font = engraveFontOf(fs, c, r.fam); ctx.fillText(c, px, ry); px += ws[j] + gap; });
        ctx.textAlign = prevAlign;
      }
      ctx.fillStyle = '#a8a196';
      ctx.font = '10px "Noto Sans TC", sans-serif';
      ctx.fillText(r.label, centerX, ry+30);
      /* 內外側刻字之間加分隔線 */
      if(i < engraveRows.length-1){
        const lineY = ry + rowSpacing/2;
        ctx.strokeStyle = '#e2ddcf'; ctx.beginPath();
        ctx.moveTo(rightX+24, lineY); ctx.lineTo(rightX+engraveColW-24, lineY); ctx.stroke();
      }
    });
  }

  y += colBlockH + 30;

  ctx.textAlign='center';
  ctx.fillStyle = '#a8a196'; ctx.font='15px "Noto Sans TC", sans-serif';
  ctx.fillText('此為個人化設計記錄圖,僅參考用;實際以成品為準。', W/2, y);

  return canvas;
}

/* 姓名/電話不觸發整體重繪,避免輸入中途失去焦點,做法與刻字文字輸入一致 */
function setCustomerName(val){ state.customerName = val; updateReportCardVisibility(); }
function setCustomerPhone(val){ state.customerPhone = val; updateReportCardVisibility(); }
/* 姓名/電話皆填寫後才顯示「回報訂單」卡片，逐字輸入即時切換，不觸發整體重繪以避免失去焦點 */
function updateReportCardVisibility(){
  const ready = !!(state.customerName.trim() && state.customerPhone.trim());
  const card = document.getElementById('reportOrderCard');
  const placeholder = document.getElementById('reportOrderPlaceholder');
  if(card) card.style.display = ready ? '' : 'none';
  if(placeholder) placeholder.style.display = ready ? 'none' : '';
}
/* 顯示送出狀態文字(成功/失敗/傳送中) */
function setSubmitStatus(msg, tone){
  const el = document.getElementById('submitStatusMsg');
  if(!el) return;
  el.textContent = msg;
  el.style.whiteSpace = 'pre-line';
  el.style.display = msg ? 'block' : 'none';
  el.style.color = tone==='error' ? 'var(--danger)' : (tone==='ok' ? '#4a7a5c' : 'var(--ink-soft)');
}

async function downloadDesignPhoto(){
  if(!renderer || !scene || !camera){
    alert('3D 預覽尚未載入完成,請稍候再試');
    return;
  }
  try{
    const canvas = buildDesignPhotoCanvas();
    const dataUrl = canvas.toDataURL('image/png');
    document.getElementById('designPhotoImg').src = dataUrl;
    document.getElementById('designPhotoModal').classList.add('open');
    window.scrollTo(0,0);
  }catch(err){
    console.error('downloadDesignPhoto failed:', err);
    alert('產生設計圖時發生錯誤,請重新整理頁面後再試一次。若持續發生,麻煩告知當時的操作步驟。');
  }
}
function closeDesignPhotoModal(e){
  if(e.target.id==='designPhotoModal' || e.target.classList.contains('design-photo-close')){
    document.getElementById('designPhotoModal').classList.remove('open');
  }
}

/* 一鍵傳送訂單圖片到 LINE:優先使用瀏覽器原生分享(Web Share API),
   讓消費者直接從分享選單點選 LINE、選擇聊天對象後送出,圖片與文字都已經帶好,不用再手動複製貼上。
   若裝置不支援原生分享(常見於桌機瀏覽器),則退回「複製文字 + 開新分頁存圖 + 開啟官方LINE」的組合方案。 */
/* 一鍵複製訂單資訊文字,並開啟官方 LINE,讓使用者直接貼上傳送 */
function shareOrderToLine(){
  const text = buildOrderText();
  const btn = event.target;
  const origLabel = btn.textContent;
  const proceed = ()=>{
    btn.textContent = '已複製!請在 LINE 貼上並傳送';
    setTimeout(()=>{ btn.textContent = origLabel; }, 2600);
    window.open(LINE_URL, '_blank');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(proceed).catch(()=>fallbackCopy(text, proceed));
  } else {
    fallbackCopy(text, proceed);
  }
}

/* 一鍵送出設計圖：驗證姓名/電話 -> 產生設計圖(原始高畫質 PNG，跟下載按鈕同畫質) -> 呼叫 Cloudflare Worker，
   由 Worker 負責把圖片存到 R2、並推播訂單通知(含文字資訊與圖片)到 teddreo 的 LINE。
   若顧客有登入 LINE，也會額外推播一份給顧客本人。 */
async function submitDesignByLine(){
  if (window.__isSubmittingDesign) { return; }
  window.__isSubmittingDesign = true;
  const name = state.customerName.trim();
  const phone = state.customerPhone.trim();

  if(!name){
    setSubmitStatus('請先填寫姓名(需與訂單收件人相符)後再送出', 'error');
    document.getElementById('customerNameInput').focus();
    window.__isSubmittingDesign = false;
    return;
  }
  if(!phone){
    setSubmitStatus('請先填寫電話(需與訂單收件人相符)後再送出', 'error');
    document.getElementById('customerPhoneInput').focus();
    window.__isSubmittingDesign = false;
    return;
  }
  if(!renderer || !scene || !camera){
    setSubmitStatus('3D 預覽尚未載入完成，請稍候再試', 'error');
    window.__isSubmittingDesign = false;
    return;
  }

  const btn = document.getElementById('submitDesignBtn');
  const origLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = '傳送中...';
  setSubmitStatus('正在產生設計圖並傳送，請稍候...', null);

  try{
    const shapeInfo = SHAPES.find(s=>s.key===state.shape);
    const finishInfo = FINISHES.find(f=>f.key===state.finish);
    const gemInfo = GEM_COLORS.find(g=>g.key===state.gemColor);

    const savedRotXForPhoto = rotX;
    if (state.engraveSideOn) {
      rotX = TILT_BASE - THREE.MathUtils.degToRad(50);
      await new Promise(r => setTimeout(r, 260));
    }
    const canvas = buildDesignPhotoCanvas();
    const imgDataUrl = canvas.toDataURL('image/png');

    const now = new Date();
    const orderNumber = BRAND_NAME.toUpperCase() + '-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '-' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0') + String(now.getSeconds()).padStart(2,'0');
    const orderTime = now.toLocaleString('zh-TW', { hour12:false });

    const engFontName = k => (ENGRAVE_FONTS.find(f=>f.key===k)||{}).family || k;
    const engColorName = c => c==='black' ? '黑色' : '原銀色';
    const engraveInner = state.engraveInnerOn ? (state.engraveInnerText || '(未填寫)') + '（' + engFontName(state.engraveInnerFont) + '・' + engColorName(state.engraveInnerColor) + '）' : '';
    const engraveOuter = state.engraveOuterOn ? (state.engraveOuterText || '(未填寫)') + '（' + engFontName(state.engraveOuterFont) + '・' + engColorName(state.engraveOuterColor) + '）' : '';
    const engraveSide = state.engraveSideOn ? (state.engraveSideText || '(未填寫)') + '（' + engFontName(state.engraveSideFont) + '・' + engColorName(state.engraveSideColor) + '）' : '';

    const payload = {
      site: SITE_NAME,
      product_name: BRAND_NAME,
      order_number: orderNumber,
      order_time: orderTime,
      customer_name: name,
      customer_phone: phone,
      shape_name: shapeInfo.name,
      width_mm: state.width + 'mm',
      finish_name: finishInfo.name,
      gem_name: state.gemChosen ? gemInfo.name : '不鑲嵌寶石',
      ring_size: state.ringSize ? (state.ringSize + ' 號') : '(尚未填寫)',
      engrave_inner: engraveInner,
      engrave_outer: engraveOuter,
      engrave_side: engraveSide,
      image_base64: imgDataUrl,
      customer_line_uid: getCustomerLineUid()
    };

    const res = await fetch(LINE_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const result = await res.json().catch(()=>({}));
    if(!res.ok || !result.ok){
      throw new Error(result.error || ('status ' + res.status));
    }

    setSubmitStatus('設計圖已送出！最後一步：請回到官網的商品頁選擇您要訂製的戒指規格並下單付款。\n我們核對設計圖與訂單後,會在 LINE 與您聯繫確認細節👩🏻‍🏭', 'ok');
  }catch(err){
    console.error('submitDesignByLine failed:', err);
    setSubmitStatus('送出時發生錯誤，請稍後再試一次，或直接聯繫官方 LINE 回報訂單。', 'error');
  }finally{
    btn.disabled = false;
    btn.textContent = origLabel;
    window.__isSubmittingDesign = false;
  }
}

function submitOrLoginThenSend(){
  const name = state.customerName.trim();
  const phone = state.customerPhone.trim();
  if(!name){
    setSubmitStatus('請先填寫姓名(需與訂單收件人相符)後再送出', 'error');
    document.getElementById('customerNameInput').focus();
    return;
  }
  if(!phone){
    setSubmitStatus('請先填寫電話(需與訂單收件人相符)後再送出', 'error');
    document.getElementById('customerPhoneInput').focus();
    return;
  }
  if (getCustomerLineUid()) {
    submitDesignByLine();
  } else {
    setSubmitStatus('正在為您導向 LINE 登入，請稍候...', null);
    startLineLogin();
  }
}

function restartAll(){
  state = {
    shape:'mobius', previewShape:null, width:4, gemColor:'diamondwhite', gemChosen:false, gemEmbed:true,
    finish:'polish', engraveInnerOn:false, engraveInnerText:'', engraveOuterOn:false, engraveOuterText:'', engraveSideOn:false, engraveSideText:'', engraveInnerColor:'silver', engraveOuterColor:'silver', engraveSideColor:'silver', engraveInnerFont:'specialelite', engraveOuterFont:'notoserif', engraveSideFont:'notoserif',
    ringSize:'', customerName:'', customerPhone:'', openSection:'engrave', revealedStep:0
  };
  refreshAll();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- 啟動 ---------- */

renderAccordion();
initThree();

/* LINE 登入完成導回後：還原之前暫存的設計狀態，若原本就是要自動送出設計圖，則自動幫顧客完成送出 */
(function restoreDesignAfterLogin(){
  const backup = storeGet('teddreo_design_backup', LOGIN_BACKUP_MAX_MS);
  const shouldAutoSubmit = storeGet('teddreo_auto_submit_after_login', LOGIN_BACKUP_MAX_MS);
  if (backup) {
    try{ Object.assign(state, JSON.parse(backup)); }catch(e){}
    state.finish = 'polish'; /* 此款式僅有亮面 */
    if(!SECTIONS.find(x=>x.id===state.openSection)) state.openSection = 'engrave';
    state.revealedStep = Math.min(state.revealedStep, SECTIONS.length-1);
    if(!SHAPES.find(s=>s.key===state.shape)) state.shape = 'mobius';
    if(!(SHAPE_ALLOWED_WIDTHS[state.shape]||WIDTHS).includes(state.width)) state.width = 4;
    storeDel('teddreo_design_backup');
  }
  if (window.__lineJustLoggedIn && !backup) {
    /* 登入成功導回,但找不到先前的設計(例如換了瀏覽器或暫存已逾時):明確告知,避免顧客以為已送出 */
    showTopNotice('LINE 登入成功,但沒有找到您剛才的設計,尚未送出。請重新完成設計後,再按「登入 LINE 並送出設計圖」。');
  }
  if (shouldAutoSubmit && getCustomerLineUid()) {
    storeDel('teddreo_auto_submit_after_login');
    state.revealedStep = SECTIONS.length - 1;
    state.openSection = 'confirm';
    refreshAll();
    setSubmitStatus('LINE 登入成功，正在為您送出設計圖...', null);
    setTimeout(function(){ submitDesignByLine(); }, 1200);
  } else if (backup) {
    refreshAll();
  }
})();
</script>
